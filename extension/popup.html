<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Firefox Local Bridge</title></head>
<body><header><img src="icon.svg" width="40" height="40" alt=""><div><h1>Firefox Local Bridge</h1><p data-i18n="subtitle">Your browser, with your permission</p></div></header><main>
<label class="language" for="language"><span data-i18n="language">Language</span><select id="language"><option value="en">English</option><option value="ro">Română</option><option value="ru">Русский</option></select></label>
<section class="status"><span id="dot"></span><strong id="status" role="status">…</strong><p id="details"></p></section>
<label class="row" for="access"><b data-i18n="access">Assistant access</b><input type="checkbox" id="access" role="switch"></label>
<label for="mode" data-i18n="scope">Access scope</label><select id="mode"><option value="browser" data-i18n="browser">Whole browser</option><option value="tab" data-i18n="tab">Current tab only</option></select>
<label for="duration" data-i18n="duration">Access duration</label><select id="duration"><option value="15" data-i18n="fifteen">15 minutes</option><option value="60" data-i18n="hour">1 hour</option><option value="240" data-i18n="four">4 hours</option><option value="1440" data-i18n="day">1 day</option><option value="0" data-i18n="manual">Until I turn it off</option><option value="custom" data-i18n="custom">Custom duration</option></select>
<div id="custom-duration" hidden class="custom"><label for="amount"><span data-i18n="amount">Amount</span><input id="amount" type="number" min="1" max="525600" step="1" value="30"></label><label for="unit"><select id="unit" aria-label="Duration unit"><option value="1" data-i18n="minutes">Minutes</option><option value="60" data-i18n="hours">Hours</option><option value="1440" data-i18n="days">Days</option></select></label></div>
<button id="apply-duration" hidden data-i18n="apply">Apply duration from now</button>
<label class="row" for="private"><span><b data-i18n="private">Private windows</b><small data-i18n="privateHint">Also needs permission in Firefox</small></span><input type="checkbox" id="private" role="switch"></label>
<p class="note" data-i18n="disclosure"></p><section id="approvals" aria-live="polite"></section><p id="error" role="alert"></p><details><summary data-i18n="help">How to connect</summary><p data-i18n="helpText"></p></details>
</main><footer data-i18n="footer">v0.2 · local bridge</footer><script src="strings.js"></script><script src="popup.js"></script></body></html>
